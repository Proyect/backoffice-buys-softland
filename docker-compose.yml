services:
  db:
    image: postgres:15-alpine
    container_name: bos_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: bos_backend
    environment:
      # BACKEND_PORT is only used for host mapping; app listens on 4000 internally
      DATABASE_URL: ${DATABASE_URL}
      # Comma-separated list of allowed origins for CORS, e.g. http://localhost:5173
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Public base URL for OpenAPI servers (optional). Example: http://localhost:${BACKEND_PORT}
      PUBLIC_BASE_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:4000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: bos_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: bos_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db

volumes:
  db_data:
